name = "tidemark"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Keeps the current track's official cover cached so cards are instant. Remove both blocks to run without it.
[triggers]
crons = ["* * * * *"]

# Persistent memory (covers, stuck-playing guard). The Cache API does nothing on workers.dev, KV does.
# `wrangler deploy` creates the namespace for you; no id needed.
[[kv_namespaces]]
binding = "ART"

# Set to your Last.fm username so the cron job knows whose track to warm.
[vars]
LASTFM_USER = "Cl0ud-9"

# Secret (never commit): npx wrangler secret put LASTFM_API_KEY
# Local dev: put LASTFM_API_KEY=... in .dev.vars
