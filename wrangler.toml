name = "tidemark"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Keeps the current track's official cover cached so cards are instant. Remove both blocks to run without it.
[triggers]
crons = ["* * * * *"]

# Persistent memory (covers, stuck-playing guard). The Cache API does nothing on workers.dev, KV does.
# `wrangler deploy` creates the namespace for you; no id needed.
[[kv_namespaces]]
binding = "ART"

# The fast path: one presence object per tracked user polls Last.fm every few seconds and keeps the card's
# state and cover ready, so card requests never wait on Last.fm. Free plans need SQLite-backed objects.
[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

# Each deployment's version id. The cron passes it to the presence objects, which restart onto new code when it
# changes: kept awake by their own alarms, they otherwise keep running the code they started with.
[version_metadata]
binding = "CF_VERSION_METADATA"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Presence"]

# Your Last.fm username (comma-separate several). These users get the presence fast path; the cron keeps it alive.
[vars]
LASTFM_USER = "Cl0ud-9"

# Secrets (never commit): npx wrangler secret put LASTFM_API_KEY
# Optional, for more covers: npx wrangler secret put GENIUS_TOKEN
# Optional, last-resort covers from YouTube "Topic" uploads: npx wrangler secret put YOUTUBE_API_KEY
# Local dev: put LASTFM_API_KEY=... in .dev.vars
